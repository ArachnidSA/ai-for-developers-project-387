name: opencode-triage

on:
  issues:
    types: [opened]

# Один автотриаж на issue за раз — два обращения не мешают друг другу
concurrency:
  group: opencode-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    # Автотриаж нужен только для НОВЫХ обращений людей.
    # Пропускаем:
    #  - ботов: готовые тикеты и спеки создаёт opencode-agent, их триажить не надо;
    #  - уже размеченные обращения (готовые тикеты несут ready-for-agent и т.п.);
    #  - отклонённые (wontfix).
    if: |
      github.event.issue.user.type != 'Bot' &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-human') &&
      !contains(github.event.issue.labels.*.name, 'needs-triage') &&
      !contains(github.event.issue.labels.*.name, 'needs-info') &&
      !contains(github.event.issue.labels.*.name, 'wontfix')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: OpenCode setup
        uses: ./.github/actions/opencode-setup

      - name: Run OpenCode triage
        uses: anomalyco/opencode/github@latest
        env:
          PROVOD_API_KEY: ${{ secrets.PROVOD_API_KEY }}
        with:
          model: provod/deepseek-v4.1-flash
          # plan-агент не правит код — автотриаж только анализирует и отвечает комментарием
          agent: plan
          prompt: |
            Это автотриаж нового обращения (issue #${{ github.event.issue.number }}).
            Прочитай файл .agents/skills/triage/SKILL.md и docs/agents/issue-tracker.md и выполни
            разбор строго по этому процессу.

            Обязательно:
            - сделай redundancy-проверку: поищи в коде уже существующую реализацию по доменным
              понятиям (а не по формулировке запроса) и укажи, где именно искал;
            - выбери РОВНО одну категорию (bug или enhancement) и РОВНО один state
              (needs-triage, needs-info, ready-for-agent, ready-for-human, wontfix);
            - если данных не хватает — задай конкретные уточняющие вопросы одним раундом.

            Результат — ровно один комментарий к этому issue с итогом разбора: категория,
            рекомендованный state, рекомендованные метки, краткий бриф и, при необходимости,
            уточняющие вопросы. Первая строка комментария — дисклеймер
            «> *Сгенерировано ИИ во время triage.*».

            Жёсткие ограничения: НЕ меняй код и файлы, НЕ создавай ветки и pull request,
            НЕ закрывай issue, НЕ применяй метки. Только анализ и один комментарий.

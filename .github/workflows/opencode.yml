name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Не даём двум упоминаниям в одном issue/PR крутиться параллельно
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # По упоминанию и только от доверенных авторов (репозиторий публичный)
    if: |
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Для раннера подменяем корневой opencode.json на конфиг с провайдером provod.ai.
      # Формат provider/npm/options — тот же, что в рабочем глобальном конфиге разработчика
      # (V2 сохраняет совместимость с этими полями). Так мы и заводим провайдера в CI,
      # и не тянем MCP-сервер render с его {file:./render-api-key}, которого в CI нет.
      # Файл меняется только в воркспейсе раннера, в репозиторий не коммитится.
      - name: Configure provod.ai provider for the run
        run: |
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "provod": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "provod.ai",
                "options": {
                  "baseURL": "https://api.provod.ai/v1",
                  "apiKey": "{env:PROVOD_API_KEY}"
                },
                "models": {
                  "deepseek-v4.1-flash": {
                    "name": "DeepSeek V4.1 Flash",
                    "limit": { "context": 1048576, "output": 943718 },
                    "reasoning": true,
                    "temperature": true,
                    "tool_call": true,
                    "attachment": true,
                    "modalities": { "input": ["text", "image"], "output": ["text"] }
                  }
                }
              }
            }
          }
          JSON

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # PROVOD_API_KEY — штатное имя секрета. Пока он не заведён, берём существующий
          # DEEPSEEK_API_KEY: судя по ошибке api.deepseek.com, в нём лежит ключ provod.ai.
          PROVOD_API_KEY: ${{ secrets.PROVOD_API_KEY || secrets.DEEPSEEK_API_KEY }}
        with:
          model: provod/deepseek-v4.1-flash

name: opencode

# Метка прогона несёт номер PR/issue — по ней считается бюджет запусков агента.
run-name: "oc #${{ github.event.issue.number || github.event.pull_request.number }}"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Не даём двум упоминаниям в одном issue/PR крутиться параллельно
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # По упоминанию и только от доверенных авторов (репозиторий публичный)
    if: |
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      # Бюджет — ДО вызова модели. Считаем попытки по истории Actions (метка прогона "oc #N"),
      # поэтому отмена, таймаут и Re-run тоже расходуют попытку. Комментарии бюджет не меняют:
      # это только отчёт. История прогонов недоступна агенту на запись.
      - name: Check agent budget
        id: budget
        uses: actions/github-script@v7
        with:
          script: |
            const LIMIT = 3
            const isPR =
              context.eventName === 'pull_request_review_comment' ||
              (context.payload.issue && context.payload.issue.pull_request != null)
            // Бюджет на PR; для обычных issue не ограничиваем.
            if (!isPR) {
              core.setOutput('allowed', 'true')
              core.setOutput('used', '0')
              return
            }
            const number = String(
              (context.payload.issue && context.payload.issue.number) ||
              (context.payload.pull_request && context.payload.pull_request.number) || ''
            )
            const tag = `oc #${number}`
            let used = 0
            for (const event of ['issue_comment', 'pull_request_review_comment']) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                { ...context.repo, workflow_id: 'opencode.yml', event, per_page: 100 },
                (response) => response.data.workflow_runs
              )
              for (const run of runs) {
                if (run.display_title !== tag) continue
                const attempts = run.run_attempt || 1
                // Свой прогон исключаем по id и учитываем только его прошлые попытки (Re-run),
                // чтобы предел не зависел от того, успел ли текущий прогон попасть в API.
                used += run.id === context.runId ? attempts - 1 : attempts
              }
            }
            const allowed = used < LIMIT
            core.info(`agent budget: tag=${tag} used=${used} limit=${LIMIT} allowed=${allowed}`)
            core.setOutput('used', String(used))
            core.setOutput('allowed', allowed ? 'true' : 'false')

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: OpenCode setup
        id: setup
        uses: ./.github/actions/opencode-setup

      # Маркеры времени нужны, чтобы отличить таймаут вызова от прочей ошибки агента:
      # таймаут шага и падение дают один и тот же outcome. Значение .agent-timeout
      # должно совпадать с timeout-minutes шага модели ниже.
      - name: Mark agent running
        if: steps.budget.outputs.allowed == 'true'
        run: |
          date +%s > .agent-start
          echo 1500 > .agent-timeout

      - name: Run OpenCode
        id: model
        if: steps.budget.outputs.allowed == 'true'
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          PROVOD_API_KEY: ${{ secrets.PROVOD_API_KEY }}
        with:
          model: provod/deepseek-v4.1-flash
          mentions: "/oc,/opencode"

      - name: Mark agent done
        if: success() && steps.budget.outputs.allowed == 'true'
        run: touch .agent-done

      # Отчёт без модели: причина, последний SHA, ссылка на логи, статус «нужен человек».
      # Дальше решает человек; автоматического цикла исправлений нет.
      - name: Report outcome
        if: always()
        uses: actions/github-script@v7
        env:
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
          ALLOWED: ${{ steps.budget.outputs.allowed }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          MODEL_OUTCOME: ${{ steps.model.outcome }}
        with:
          script: |
            const fs = require('fs')
            const budget = process.env.BUDGET_OUTCOME
            const allowed = process.env.ALLOWED
            const setup = process.env.SETUP_OUTCOME
            const model = process.env.MODEL_OUTCOME

            let reason = ''
            if (budget === 'failure') reason = 'infra'
            else if (allowed !== 'true') reason = 'limit_exhausted'
            else if (setup === 'failure') reason = 'infra'
            else if (model === 'failure' || model === 'cancelled') {
              const done = fs.existsSync('.agent-done')
              let elapsed = 0
              let limit = 1500
              try {
                elapsed = Math.floor(Date.now() / 1000) - Number(fs.readFileSync('.agent-start', 'utf8').trim())
                limit = Number(fs.readFileSync('.agent-timeout', 'utf8').trim()) || limit
              } catch {}
              // Успел ли вызов упереться в свой таймаут: время близко к пределу шага.
              reason = !done && elapsed >= limit - 60 ? 'timeout' : 'agent_failed'
            }
            if (!reason) return

            const isPR =
              context.eventName === 'pull_request_review_comment' ||
              (context.payload.issue && context.payload.issue.pull_request != null)
            const number = (context.payload.issue && context.payload.issue.number) ||
                           (context.payload.pull_request && context.payload.pull_request.number)
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            let sha = '(не PR)'
            if (isPR) {
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number })
              sha = pr.head.sha
            }

            const title = {
              limit_exhausted: 'Предел запусков агента в этом PR исчерпан',
              timeout: 'Вызов агента остановлен по таймауту',
              infra: 'Сбой подготовки инструмента или отсутствует ключ',
              agent_failed: 'Сбой агента',
            }[reason]

            const body = [
              `### ${title}`,
              '',
              `- Причина: \`${reason}\``,
              `- Последний SHA: \`${sha}\``,
              `- Логи: ${url}`,
              '- Статус: **нужен человек** — следующий шаг выбирает человек, автоматического цикла исправлений нет.',
            ].join('\n')
            await github.rest.issues.createComment({ ...context.repo, issue_number: number, body })

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Не даём двум упоминаниям в одном issue/PR крутиться параллельно
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # По упоминанию и только от доверенных авторов (репозиторий публичный)
    if: |
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: OpenCode setup
        uses: ./.github/actions/opencode-setup

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          PROVOD_API_KEY: ${{ secrets.PROVOD_API_KEY }}
        with:
          model: provod/deepseek-v4.1-flash
          mentions: "/oc,/opencode"

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Не даём двум упоминаниям в одном issue/PR крутиться параллельно
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # По упоминанию и только от доверенных авторов (репозиторий публичный)
    if: |
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # opencode.json ссылается на {file:./render-api-key}, а в CI этого файла нет
      # (он в .gitignore), и отсутствующий файл — фатальная ошибка конфига.
      # Пустой файл даёт MCP-серверу render пустой ключ: он просто не подключится.
      - name: Provide empty render-api-key for the project config
        run: touch render-api-key

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          model: deepseek/deepseek-v4-flash

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Не даём двум упоминаниям в одном issue/PR крутиться параллельно
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # По упоминанию и только от доверенных авторов (репозиторий публичный)
    if: |
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # opencode.json ссылается на {file:./render-api-key}, а в CI этого файла нет
      # (он в .gitignore), и отсутствующий файл — фатальная ошибка конфига.
      # Пустой файл даёт MCP-серверу render пустой ключ: он просто не подключится.
      - name: Provide empty render-api-key for the project config
        run: touch render-api-key

      # Провайдер provod.ai объявляем только для CI: .opencode/ переопределяет корневой
      # opencode.json, поэтому локальная конфигурация разработчика не затронута.
      - name: Configure provod.ai provider for the run
        run: |
          mkdir -p .opencode
          cat > .opencode/opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "providers": {
              "provod": {
                "name": "provod.ai",
                "package": "@opencode/ai/providers/openai-compatible",
                "env": ["PROVOD_API_KEY"],
                "settings": { "baseURL": "https://api.provod.ai/v1" },
                "models": {
                  "deepseek-v4.1-flash": {
                    "name": "DeepSeek V4.1 Flash",
                    "capabilities": { "tools": true, "input": ["text", "image"], "output": ["text"] },
                    "limit": { "context": 1048576, "output": 943718 }
                  }
                }
              }
            }
          }
          JSON

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # PROVOD_API_KEY — штатное имя секрета. Пока он не заведён, берём существующий
          # DEEPSEEK_API_KEY: судя по ошибке api.deepseek.com, в нём лежит ключ provod.ai.
          PROVOD_API_KEY: ${{ secrets.PROVOD_API_KEY || secrets.DEEPSEEK_API_KEY }}
        with:
          model: provod/deepseek-v4.1-flash

[project]
name = "ai-for-developers-project-386"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.165.0",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.1.9",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.uv]
python-preference = "system"
